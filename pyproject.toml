[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cipherscope-desktop"
version = "1.0.0"
description = "A retro workstation for encryption, cryptanalysis and S-box research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CipherScope contributors"}]
keywords = ["cryptography", "cryptanalysis", "desktop", "AES-GCM", "S-box", "PySide6"]
dependencies = ["cryptography>=42,<47", "PySide6>=6.6,<7", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyinstaller>=6"]

[project.scripts]
cipherscope = "cipherscope.__main__:main"
cipherscope-cli = "cipherscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
